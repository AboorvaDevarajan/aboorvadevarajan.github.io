<style>
  .home-photo {
    display: inline-block;
    position: relative;
    animation: home-pop 0.85s cubic-bezier(0.18, 1.4, 0.4, 1) backwards;
  }

  .home-photo img {
    animation: home-float 4.2s ease-in-out 1.1s infinite;
  }

  .home-photo::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 108px;
    height: 108px;
    margin: -54px 0 0 -54px;
    border-radius: 50%;
    border: 2px solid #0096cc;
    pointer-events: none;
    animation: home-ripple 1.5s ease-out 0.45s both;
  }

  .home-name {
    animation: home-rise 0.8s ease 0.2s backwards;
  }

  .home-name::after {
    content: "";
    display: block;
    width: 72px;
    height: 3px;
    margin: 0.55rem auto 0;
    border-radius: 2px;
    background: #0096cc;
    transform: scaleX(0);
    animation: home-line 0.55s ease 0.75s forwards;
  }

  .home-about h3,
  .home-about p {
    animation: home-rise 0.7s ease backwards;
  }

  .home-about h3 { animation-delay: 0.4s; }
  .home-about p { animation-delay: 0.55s; }

  .home-contact a {
    animation: home-icon 0.55s cubic-bezier(0.18, 1.45, 0.4, 1) backwards;
    transition: transform 0.2s ease;
  }

  .home-contact a:nth-child(1) { animation-delay: 0.5s; }
  .home-contact a:nth-child(2) { animation-delay: 0.58s; }
  .home-contact a:nth-child(3) { animation-delay: 0.66s; }
  .home-contact a:nth-child(4) { animation-delay: 0.74s; }
  .home-contact a:nth-child(5) { animation-delay: 0.82s; }
  .home-contact a:nth-child(6) { animation-delay: 0.9s; }

  .home-contact a:hover {
    transform: translateY(-4px);
  }

  .home-contact a i {
    transition: transform 0.2s ease;
  }

  .home-contact a:hover i {
    transform: scale(1.12);
  }

  @keyframes home-pop {
    0% { opacity: 0; transform: scale(0.35) translateY(10px); }
    70% { opacity: 1; transform: scale(1.08) translateY(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes home-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes home-ripple {
    0% { opacity: 0.65; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.7); }
  }

  @keyframes home-rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes home-line {
    to { transform: scaleX(1); }
  }

  @keyframes home-icon {
    0% { opacity: 0; transform: translateY(12px) scale(0.7); }
    100% { opacity: 1; transform: none; }
  }

  .home-walker {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 30;
    width: 46px;
    height: 54px;
    pointer-events: none;
  }

  .home-walker svg {
    display: block;
    width: 46px;
    height: 54px;
    overflow: visible;
    transform-origin: 50% 100%;
    animation: home-waddle 1.1s ease-in-out infinite;
  }

  @keyframes home-waddle {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50% { transform: rotate(6deg) translateY(-3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .home-photo,
    .home-photo img,
    .home-photo::after,
    .home-name,
    .home-name::after,
    .home-about h3,
    .home-about p,
    .home-contact a,
    .home-contact a i {
      animation: none !important;
      transition: none !important;
      transform: none !important;
      opacity: 1 !important;
    }

    .home-walker {
      display: none !important;
    }
  }
</style>

  </svg>
</div>
