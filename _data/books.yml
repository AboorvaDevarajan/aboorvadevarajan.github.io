- title: Sapiens
  subtitle: A Brief History of Humankind
  authors: Yuval Noah Harari
  image: sapiens.jpg
  back_image: sapiens-back.jpg
  summary: |
    The whole human story in one book, **from insignificant apes to rulers of the world**.

    The back page says it best:

    - **Fire gave us power.**
    - **Gossip helped us cooperate.**
    - **Agriculture made us hungry for more.**
    - **Mythology maintained law and order.**
    - **Money gave us something we can really trust.**
    - **Contradictions created culture.**
    - **Science made us deadly.**

    Harari tells it through three turns. The **Cognitive Revolution**, when we started to think and talk in new ways. The **Agricultural Revolution**, when we settled down. The **Scientific Revolution**, when we admitted we did not know everything and went looking.

    The big idea: we cooperate in huge numbers because we share stories. Nations, money, laws, companies. He calls them **imagined orders**. They exist because enough of us believe in them.

    Two lines that stuck. **The Agricultural Revolution was history's biggest fraud.** And, about wheat: **We did not domesticate wheat. It domesticated us.**

    It makes you look at ordinary things, a banknote, a border, a brand, and see a story everyone agreed on. <img class="smiley" src="/assets/img/icons/smile.png" alt="">

- title: Ikigai
  subtitle: The Japanese Secret to a Long and Happy Life
  authors: Héctor García and Francesc Miralles
  image: ikigai.jpg
  summary: |
    In Japanese, ikigai (生き甲斐) is a combination of letters that mean **life** and **to be worthwhile**. The book calls it **the happiness of always being busy**.

    García and Miralles did a hundred interviews in Ogimi, Okinawa, the village with the most people past a hundred. They asked what a long, happy life looks like.

    It sits where four things meet: **what you love**, **what you are good at**, **what the world needs**, and **what you can be paid for**. If you do not know yours yet, **your mission is to discover it**.

    The rules they came back with:

    - **Stay active; don't retire.**
    - **Take it slow.** **Live an unhurried life.** **Walk slowly and you'll go far.**
    - Eat until you are about 80 percent full. **Hara hachi bu.**
    - **Nurture your friendships every day.**
    - Move. Smile. **Give thanks.** **Live in the moment.**

    Flow is being fully inside one thing. **Concentrating on one thing at a time** is how you get there. The happiest people are not the ones who achieve the most. They are the ones who **spend more time in a state of flow**.

    And the old people, in their own words: **Don't worry.** **Cultivate good habits.** **Be optimistic.** **Learn to relax.** **Keep both mind and body busy, and you'll be here a long time.**

    The line I kept: **They were always pursuing their ikigai, but they were never in a rush.** <img class="smiley" src="/assets/img/icons/smile.png" alt="">
